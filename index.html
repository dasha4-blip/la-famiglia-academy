<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d2219">
<title>LA FAMIGLIA ACADEMY</title>
<meta name="description" content="База знаний команды LA FAMIGLIA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d2219'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23c4a668' stroke-width='1.6'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Georgia,serif' font-size='22' fill='%23c4a668'%3ELF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --forest: #0d2219;
  --forest-2: #112a20;
  --emerald: #0f3a2c;
  --emerald-2: #154a3a;
  --gold: #c4a668;
  --gold-2: #d9c495;
  --gold-deep: #9a7d45;
  --gold-line: rgba(196, 166, 104, .34);
  --gold-faint: rgba(196, 166, 104, .12);
  --ivory: #f5efe2;
  --ivory-2: #ece3cf;
  --paper-card: #fbf7ee;
  --ink: #1c2220;
  --ink-2: #4f5853;
  --graphite: #1a1f1d;
  --wine: #6e2d2d;
  --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --sans: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(1100px 620px at 50% -12%, rgba(30, 92, 70, .55), transparent 70%),
    radial-gradient(900px 500px at 100% 100%, rgba(8, 26, 19, .9), transparent 70%),
    var(--forest);
  background-attachment: fixed;
  color: var(--ivory);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; }
::selection { background: rgba(196, 166, 104, .35); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 2px; }

/* ===== Шапка ===== */
.site-header {
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background: rgba(13, 34, 25, .78);
  border-bottom: 1px solid rgba(196, 166, 104, .16);
}
.site-header__inner {
  max-width: 1180px; margin: 0 auto; height: 64px;
  padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand__mark { width: 36px; height: 36px; flex: none; }
.brand__name { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: .14em; line-height: 1; }
.brand__sub { display: block; font-family: var(--sans); font-size: 9.5px; font-weight: 600; letter-spacing: .5em; color: var(--gold); margin-top: 5px; }
.header-link {
  font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; text-decoration: none;
  color: var(--gold-2); padding: 10px 2px; border-bottom: 1px solid transparent; transition: border-color .3s, color .3s;
}
.header-link:hover { color: var(--ivory); border-color: var(--gold); }

/* ===== Общие ===== */
.wrap { max-width: 1180px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.rule {
  display: flex; align-items: center; gap: 14px; color: var(--gold);
  width: min(320px, 70%); margin: 28px auto;
}
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-line), var(--gold)); }
.rule::after { background: linear-gradient(90deg, var(--gold), var(--gold-line), transparent); }
.rule i { width: 7px; height: 7px; border: 1px solid var(--gold); transform: rotate(45deg); flex: none; }
.rule--left { margin: 26px 0; width: min(260px, 80%); }
.rule--left::before { display: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 12px 22px;
  font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  text-decoration: none; cursor: pointer; border-radius: 2px;
  color: var(--gold-2); background: transparent; border: 1px solid var(--gold-line);
  transition: background .35s var(--ease), border-color .35s, color .35s, transform .2s;
}
.btn:hover { border-color: var(--gold); color: var(--ivory); background: var(--gold-faint); }
.btn:active { transform: scale(.98); }
.btn svg { width: 16px; height: 16px; flex: none; }

/* ===== Переходы ===== */
#view { min-height: calc(100vh - 64px - 120px); }
#view.is-entering { animation: viewIn .7s var(--ease) both; }
#view.is-leaving { opacity: 0; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease; }
@keyframes viewIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: viewIn .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }

/* ===== Главная ===== */
.hero { text-align: center; padding-top: 76px; padding-bottom: 30px; }
.hero__crest { width: 76px; height: 76px; margin: 0 auto 26px; display: block; }
.hero__title {
  margin: 0; font-family: var(--serif); font-weight: 500; line-height: .95;
  font-size: clamp(46px, 10.5vw, 112px); letter-spacing: .05em; color: var(--ivory);
}
.hero__academy {
  display: block; margin-top: 18px; font-family: var(--sans); font-weight: 600;
  font-size: clamp(12px, 1.6vw, 15px); letter-spacing: .72em; padding-left: .72em; color: var(--gold);
}
.hero__subtitle { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: clamp(24px, 3.4vw, 32px); color: var(--gold-2); }
.hero__intro { max-width: 540px; margin: 16px auto 0; color: rgba(245, 239, 226, .78); font-size: 17px; }

.program { padding-top: 46px; padding-bottom: 96px; }
.program__head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 26px; padding-bottom: 16px; border-bottom: 1px solid rgba(196, 166, 104, .2); }
.program__head h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 3vw, 34px); }
.program__head span { color: rgba(245, 239, 226, .55); font-size: 14px; }

.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
.card {
  position: relative; flex: 1 1 calc(33.333% - 20px); max-width: calc(33.333% - 13.4px); min-width: 280px;
  display: flex; flex-direction: column; text-decoration: none; color: var(--ivory);
  padding: 30px 28px 26px; min-height: 300px; border-radius: 3px; overflow: hidden;
  background: linear-gradient(165deg, rgba(24, 78, 61, .62) 0%, rgba(14, 44, 33, .74) 55%, rgba(10, 32, 24, .85) 100%);
  border: 1px solid rgba(196, 166, 104, .2);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 20px 50px rgba(0, 0, 0, .25);
  transition: transform .45s var(--ease), border-color .45s, box-shadow .45s, background .45s;
}
.card::before {
  content: ""; position: absolute; left: 28px; right: 28px; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transform: scaleX(.25); opacity: .6; transition: transform .6s var(--ease), opacity .6s;
}
.card:hover { transform: translateY(-4px); border-color: rgba(196, 166, 104, .55); box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 30px 70px rgba(0, 0, 0, .38); }
.card:hover::before { transform: scaleX(1); opacity: 1; }
.card:active { transform: translateY(-1px) scale(.99); }
.card__num { font-family: var(--serif); font-weight: 500; font-size: 58px; line-height: 1; color: var(--gold); letter-spacing: .02em; }
.card__en { margin-top: 22px; font-size: 11.5px; font-weight: 600; letter-spacing: .26em; color: var(--gold-2); }
.card__ru { margin: 8px 0 0; font-family: var(--serif); font-weight: 600; font-size: 29px; line-height: 1.15; }
.card__desc { margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: rgba(245, 239, 226, .7); }
.card__go {
  margin-top: auto; padding-top: 22px; display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-2);
}
.card__go svg { width: 22px; height: 22px; transition: transform .45s var(--ease); }
.card:hover .card__go svg { transform: translateX(6px); }

/* ===== Страница раздела ===== */
.chapter { position: relative; padding-top: 34px; padding-bottom: 44px; }
.chapter__top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; }
.crumbs { font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: rgba(245, 239, 226, .55); }
.crumbs a { color: var(--gold-2); text-decoration: none; }
.crumbs a:hover { color: var(--ivory); }
.crumbs span { margin: 0 8px; color: var(--gold-line); }
.chapters { display: flex; gap: 6px; }
.chapters a {
  width: 40px; height: 40px; display: grid; place-items: center; text-decoration: none;
  font-family: var(--serif); font-size: 18px; font-weight: 600; color: rgba(245, 239, 226, .55);
  border: 1px solid rgba(196, 166, 104, .18); border-radius: 50%; transition: all .3s;
}
.chapters a:hover { color: var(--ivory); border-color: var(--gold); }
.chapters a[aria-current="page"] { color: var(--forest); background: var(--gold); border-color: var(--gold); }
.chapter__head { position: relative; margin-top: 54px; max-width: 860px; }
.chapter__ghost {
  position: absolute; right: -40px; top: -70px; z-index: -1; pointer-events: none; user-select: none;
  font-family: var(--serif); font-weight: 600; font-size: clamp(160px, 26vw, 300px); line-height: 1;
  color: rgba(196, 166, 104, .07);
}
.chapter__title { margin: 14px 0 0; font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 7vw, 76px); line-height: 1.02; }
.chapter__subtitle { margin: 16px 0 0; font-family: var(--serif); font-style: italic; font-size: clamp(21px, 2.6vw, 27px); color: var(--gold-2); }
.chapter__actions { margin-top: 30px; }

/* ===== Область чтения ===== */
.paper {
  position: relative; max-width: 860px; margin: 0 auto;
  background: var(--ivory); color: var(--ink);
  padding: clamp(26px, 5.5vw, 68px) clamp(20px, 6vw, 76px);
  border-radius: 3px;
  box-shadow: 0 40px 90px rgba(0, 0, 0, .38), 0 0 0 1px rgba(196, 166, 104, .25);
}
.paper::before {
  content: ""; position: absolute; inset: 10px; pointer-events: none; border: 1px solid rgba(154, 125, 69, .22); border-radius: 2px;
}
.paper > :first-child { margin-top: 0; }
.paper p { margin: 0 0 16px; }
.paper strong { font-weight: 700; color: #14201b; }
.paper a { color: var(--emerald-2); text-decoration-color: rgba(21, 74, 58, .4); text-underline-offset: 3px; }
.lead { font-family: var(--serif); font-size: clamp(22px, 2.6vw, 26px); line-height: 1.45; color: #22302a; }
.block { padding: 40px 0 8px; border-top: 1px solid rgba(154, 125, 69, .25); }
.paper > .block:first-child, .paper > .lead + .block { border-top: 0; }
.paper > .lead + .block { padding-top: 18px; }
.block > :last-child { margin-bottom: 0; }
.h2 { display: flex; align-items: baseline; gap: 16px; margin: 0 0 18px; font-family: var(--serif); font-weight: 600; font-size: clamp(27px, 3.4vw, 34px); line-height: 1.15; color: #14201b; }
.h2 small { font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--gold-deep); flex: none; }
.h3 { margin: 28px 0 10px; font-family: var(--serif); font-weight: 600; font-size: 23px; line-height: 1.25; color: var(--emerald); }
.list { list-style: none; margin: 0 0 18px; padding: 0; }
.list li { position: relative; padding: 0 0 0 26px; margin: 0 0 10px; }
.list li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 6px; height: 6px; background: var(--gold-deep); transform: rotate(45deg); }

.note {
  margin: 22px 0; padding: 18px 22px; background: var(--ivory-2); border-left: 2px solid var(--gold-deep);
  font-size: 16px; color: #2b332f;
}
.note b { display: block; margin-bottom: 4px; font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-deep); }
.note--wine { border-left-color: var(--wine); background: #efe2d6; }
.note--wine b { color: var(--wine); }

/* Принцип LA FAMIGLIA */
.principle {
  position: relative; margin: 44px 0 6px; padding: 34px clamp(22px, 4vw, 44px) 32px;
  background: linear-gradient(160deg, var(--emerald-2), var(--emerald) 55%, #0b2c21);
  color: var(--ivory); border-radius: 2px; box-shadow: 0 20px 50px rgba(15, 58, 44, .3);
}
.principle::before { content: ""; position: absolute; inset: 8px; border: 1px solid var(--gold-line); pointer-events: none; }
.principle__label { display: flex; align-items: center; gap: 12px; font-size: 11.5px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.principle__label svg { width: 22px; height: 22px; flex: none; }
.principle p { margin: 14px 0 0; font-family: var(--serif); font-style: italic; font-size: clamp(21px, 2.5vw, 25px); line-height: 1.45; color: var(--ivory); }

/* Термины */
.terms { display: grid; grid-template-columns: 1fr; gap: 14px; margin: 6px 0 0; }
.term {
  padding: 22px 22px 20px; background: var(--paper-card); border: 1px solid rgba(154, 125, 69, .22); border-radius: 2px;
  transition: border-color .35s, transform .35s var(--ease), box-shadow .35s;
}
.term:hover { border-color: rgba(154, 125, 69, .55); transform: translateY(-2px); box-shadow: 0 14px 30px rgba(60, 50, 20, .1); }
.term dt { font-family: var(--serif); font-weight: 600; font-size: 23px; line-height: 1.2; color: var(--emerald); }
.term dt span { display: block; margin-bottom: 6px; font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: .2em; color: var(--gold-deep); }
.term dd { margin: 8px 0 0; font-size: 15.5px; line-height: 1.6; color: #333b37; }

/* Сообщение */
.message {
  margin: 22px 0 8px; border-radius: 3px; overflow: hidden;
  background: linear-gradient(160deg, var(--emerald-2), var(--emerald) 60%, #0c3125);
  box-shadow: 0 22px 50px rgba(15, 58, 44, .28);
}
.message__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid rgba(196, 166, 104, .22); }
.message__label { font-size: 11px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.copy {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 14px; cursor: pointer;
  font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--forest); background: var(--gold); border: 0; border-radius: 2px; transition: background .3s, transform .2s;
}
.copy:hover { background: var(--gold-2); }
.copy:active { transform: scale(.97); }
.copy svg { width: 15px; height: 15px; }
.message__body { padding: 22px 18px 24px; }
.bubble {
  margin: 0; max-width: 560px; padding: 16px 18px; white-space: pre-wrap; overflow-wrap: anywhere;
  font-family: var(--sans); font-size: 16.5px; line-height: 1.6; color: var(--ivory);
  background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .08); border-radius: 16px 16px 16px 4px;
}

/* Голосовые */
.voices { display: flex; align-items: center; gap: 22px; margin: 22px 0; padding: 22px; background: var(--paper-card); border: 1px solid rgba(154, 125, 69, .22); }
.voices__num { font-family: var(--serif); font-size: 72px; font-weight: 600; line-height: .9; color: var(--gold-deep); }
.voices__text { font-family: var(--serif); font-size: 22px; line-height: 1.3; color: var(--emerald); }
.voices__waves { display: flex; gap: 8px; margin-top: 10px; }
.voices__waves span { display: inline-flex; align-items: center; gap: 3px; padding: 7px 11px; background: var(--emerald); border-radius: 20px; }
.voices__waves i { display: block; width: 2px; background: var(--gold-2); border-radius: 1px; }

/* Возражения: шаги */
.steps { list-style: none; margin: 10px 0 0; padding: 0; counter-reset: step; }
.steps > li { position: relative; padding: 0 0 26px 62px; counter-increment: step; }
.steps > li::before {
  content: counter(step); position: absolute; left: 0; top: -2px; width: 42px; height: 42px; display: grid; place-items: center;
  font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--ivory); background: var(--emerald); border-radius: 50%;
  box-shadow: 0 0 0 4px var(--ivory), 0 0 0 5px rgba(154, 125, 69, .45);
}
.steps > li::after { content: ""; position: absolute; left: 20.5px; top: 46px; bottom: 6px; width: 1px; background: rgba(154, 125, 69, .35); }
.steps > li:last-child::after { display: none; }
.steps h4 { margin: 4px 0 8px; font-family: var(--serif); font-size: 24px; font-weight: 600; color: #14201b; }
.steps p { margin: 0 0 10px; }
.say { display: block; margin: 8px 0; padding: 10px 16px; font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1.4; color: var(--emerald); background: var(--paper-card); border-left: 2px solid var(--gold); }
.examples-label { font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-deep); }

/* Возражения: разборы */
.objection { margin: 22px 0 0; padding: 26px clamp(18px, 3.4vw, 32px) 10px; background: var(--paper-card); border: 1px solid rgba(154, 125, 69, .25); border-radius: 2px; }
.objection h3 { position: relative; margin: 0 0 18px; padding-left: 34px; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 27px; line-height: 1.2; color: #14201b; }
.objection h3::before { content: "\201C"; position: absolute; left: 0; top: -8px; font-size: 62px; line-height: 1; color: var(--gold); font-style: normal; }
.objection dl { margin: 0; }
.objection .row { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 12px 0; border-top: 1px solid rgba(154, 125, 69, .2); }
.objection dt { font-size: 11.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-deep); padding-top: 3px; }
.objection dd { margin: 0; font-size: 16px; }
.objection dd q { quotes: "«" "»"; font-family: var(--serif); font-style: italic; font-size: 19.5px; line-height: 1.4; color: var(--emerald); }

/* Заявка: шаги и поля */
.app-steps { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 10px 0 0; }
.app-step { display: grid; grid-template-columns: 74px 1fr; gap: 6px 16px; padding: 20px; background: var(--paper-card); border: 1px solid rgba(154, 125, 69, .22); border-radius: 2px; }
.app-step__n { grid-row: span 2; font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--gold-deep); letter-spacing: .08em; text-transform: uppercase; line-height: 1.1; }
.app-step__n b { display: block; font-size: 44px; line-height: .95; color: var(--emerald); }
.app-step h4 { margin: 0; font-family: var(--serif); font-size: 23px; font-weight: 600; color: #14201b; line-height: 1.2; }
.app-step p, .app-step ul { margin: 0; font-size: 16px; }
.app-step .list { margin-top: 8px; }
.app-step .list li { margin-bottom: 4px; }
.app-step--extra { background: transparent; border-style: dashed; }
.tag { display: inline-block; margin-left: 6px; padding: 2px 8px; font-family: var(--sans); font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; vertical-align: middle; color: var(--gold-deep); border: 1px solid rgba(154, 125, 69, .45); border-radius: 20px; }
.fields { margin: 10px 0 0; border-top: 1px solid rgba(154, 125, 69, .3); }
.fields .row { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 13px 0; border-bottom: 1px solid rgba(154, 125, 69, .2); }
.fields dt { font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--emerald); }
.fields dd { margin: 0; font-size: 16px; color: #333b37; }
.devices { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 16px 0 18px; }
.device { padding: 22px; background: var(--emerald); color: var(--ivory); border-radius: 2px; position: relative; }
.device::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--gold-line); pointer-events: none; }
.device span { font-size: 11px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.device b { display: block; margin-top: 6px; font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1.15; }
.checks { list-style: none; margin: 8px 0 18px; padding: 0; }
.checks li { position: relative; padding: 12px 0 12px 40px; border-bottom: 1px solid rgba(154, 125, 69, .2); }
.checks li::before {

<template id="tpl-candidate-management">
  <section class="block">
    <h2 class="h2"><small>01</small>Поиск кандидатов</h2>
    <p>Используй разные источники трафика, не ограничивайся одним способом.</p>

    <h3 class="h3">Холодный трафик</h3>
    <p>Основной источник холодного трафика — TG-лиды, которые выдаёт команда через спам. Это люди, незнакомые со сферой и таким форматом работы.</p>

    <h3 class="h3">Тёплый трафик</h3>
    <p>Самостоятельно ищи потенциальных кандидатов через:</p>
    <ul class="list">
      <li>Приложения для знакомств: DaVinci, Twinby и другие платформы.</li>
      <li>TikTok — находи девушек, которым может быть интересна работа.</li>
      <li>Instagram — ищи потенциальных кандидатов через профили и социальные сети.</li>
      <li>Личное окружение — знакомые, друзья и люди, которых ты уже знаешь.</li>
    </ul>
    <p>Начинай с собственного круга общения. У знакомых уже есть определённый уровень доверия к тебе, поэтому начать разговор и рассказать о возможности сотрудничества часто проще.</p>

    <h3 class="h3">Внешний вид профиля</h3>
    <p>Профиль должен выглядеть живым и вызывать доверие. Добавь подходящую фотографию, публикуй фото и истории, поддерживай регулярную активность.</p>
    <p>Не допускай, чтобы профиль выглядел пустым, искусственным или недавно созданным. Информация и публикации должны выглядеть естественно.</p>
    <div class="note"><b>Помни</b>Перед ответом кандидат может зайти на твою страницу. Профиль часто становится первым впечатлением о тебе.</div>
  </section>

  <section class="block">
    <h2 class="h2"><small>02</small>Работа с заинтересованностью</h2>
    <ul class="list">
      <li>Выясняй, интересен ли человеку формат сотрудничества.</li>
      <li>Понимай, что именно его заинтересовало.</li>
      <li>Отвечай на вопросы и объясняй непонятные моменты.</li>
      <li>Не перегружай информацией.</li>
      <li>Поддерживай диалог, а не просто отправляй заготовленные сообщения.</li>
      <li>Постепенно переходи к следующему этапу, если кандидат заинтересован.</li>
    </ul>
  </section>

  <section class="block">
    <h2 class="h2"><small>03</small>Правила общения с кандидатами</h2>
    <ul class="list">
      <li>Общайся дружелюбно и непринуждённо.</li>
      <li>Пиши преимущественно с маленькой буквы.</li>
      <li>Используй стикеры и эмодзи, чтобы общение было живым.</li>
      <li>Избегай чрезмерно официальных формулировок.</li>
      <li>Не дави и не заставляй человека принимать решение.</li>
      <li>Не игнорируй вопросы.</li>
      <li>Не предоставляй ложную информацию.</li>
      <li>Уважай личные границы и решение кандидата.</li>
      <li>Подстраивайся под стиль собеседника, сохраняя дружелюбный тон.</li>
    </ul>
    <aside class="principle">
      <div class="principle__label"><svg><use href="#crest"/></svg>Главное</div>
      <p>Кандидат должен чувствовать, что общается с реальным человеком, а не с ботом или менеджером, механически выполняющим скрипт.</p>
    </aside>
  </section>

  <section class="block">

    <p>Если кандидат не отвечает, используй Follow-up.</p>
    <ul class="list">
      <li>Напоминай о себе ненавязчиво.</li>
      <li>Меняй формулировки повторных сообщений.</li>
      <li>Учитывай предыдущий диалог.</li>
      <li>Не отправляй много сообщений подряд без необходимости.</li>
      <li>Если кандидат отказался, не продолжай навязывать предложение.</li>
    </ul>
  </section>

  <section class="block">
    <h2 class="h2"><small>05</small>Сопровождение кандидата</h2>
    <ul class="list">
      <li>Поддерживай связь с заинтересованным кандидатом.</li>
      <li>Помогай разобраться в следующих этапах.</li>
      <li>Согласовывай дату и время собеседования.</li>
      <li>Напоминай о договорённостях.</li>
      <li>Уточняй результат собеседования.</li>
      <li>Сопровождай кандидата на этапах регистрации и достижения первого результата.</li>

<template id="tpl-objection-handling">
  <p class="lead">Возражение — это не всегда отказ. Часто кандидат заинтересован в предложении, но у него остаются вопросы, сомнения или опасения.</p>
  <p>Главная задача — понять причину сомнения, дать честный и понятный ответ и помочь кандидату разобраться в предложении. Не нужно спорить, давить или пытаться переубедить человека любой ценой.</p>

  <section class="block">
    <h2 class="h2"><small>01</small>Почему возникают возражения</h2>
    <p>Основные причины:</p>
    <ul class="list">
      <li><strong>Недоверие</strong> — кандидат боится мошенничества или не уверен в надёжности предложения.</li>
      <li><strong>Недостаток информации</strong> — не до конца понимает формат работы.</li>
      <li><strong>Страх нового</strong> — раньше не сталкивался с такой сферой.</li>
      <li><strong>Сомнения в заработке</strong> — не уверен, что сможет получать заявленный доход.</li>
      <li><strong>Нехватка времени</strong> — переживает, что не получится совмещать работу с учёбой или другими делами.</li>
      <li><strong>Неуверенность в себе</strong> — боится, что не справится.</li>
    </ul>
    <div class="note"><b>Важно</b>Не воспринимай каждое возражение как отказ. Сначала выясни, что именно беспокоит человека.</div>
  </section>

  <section class="block">
    <h2 class="h2"><small>02</small>Техника обработки возражений</h2>
    <p>Используй последовательность из пяти этапов.</p>
    <ol class="steps">
      <li>
        <h4>Принятие возражения</h4>

  }

  document.addEventListener("click", function (event) {
    var button = event.target.closest("[data-copy]");
    if (!button) return;
    var source = document.getElementById(button.getAttribute("data-copy"));
    var label = button.querySelector("span");
    copyText(source.textContent).then(function () {
      label.textContent = "Скопировано";
    }, function () {
      var range = document.createRange();
      range.selectNodeContents(source);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      label.textContent = "Выделено, скопируйте";
    });
    setTimeout(function () { label.textContent = "Скопировать"; }, 2200);
  });

  window.addEventListener("hashchange", onRoute);
  onRoute();
})();
</script>
</body>
</html>
